name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and package MCPB
        run: npm run mcpb

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.mcpb"
          generateReleaseNotes: true
          draft: false
          prerelease: false
          # The release is sometimes created by hand before this workflow finishes.
          # Without allowUpdates the action then fails with "already_exists" and the
          # .mcpb asset is never attached; the omit flags keep manually written
          # release notes and titles intact when updating.
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true