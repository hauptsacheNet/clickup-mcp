# Secret scan (DEV-25). Scans only the commits a pull request or push adds, so old
# fixtures already in history do not fail it. Same pinned gitleaks and checksum
# check as id-amazon-ops; to change the rules, add .github/gitleaks.toml.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt on the v8.30.1 GitHub release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (refuse unless the checksum matches)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # A .gitleaks.toml at the repo root is loaded automatically and could switch detection off.
      - name: Refuse a root gitleaks config
        run: |
          if [ -e .gitleaks.toml ]; then
            echo "::error::Put gitleaks rules in .github/gitleaks.toml, not .gitleaks.toml at the root."
            exit 1
          fi

      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="${BASE}..${HEAD}"
          else
            range="-1 ${HEAD}"   # new branch or force push: scan the tip commit
          fi
          config=()
          if [ -f .github/gitleaks.toml ]; then config=(--config .github/gitleaks.toml); fi
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git . "${config[@]}" --log-opts="$range" --redact --no-banner --verbose
